# This workflow publishes tested cross-platform specrelay binaries for version tags.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build local CLIs
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/specrelay-bin"
          mkdir -p "$install_dir"
          go build -o "$install_dir/specrelay" ./cmd/specrelay
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/specrelay" --version

      - name: Run Go tests
        run: go test ./...

      - name: Validate release notes
        run: bash scripts/extract-release-notes.sh CHANGELOG.md "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/release-notes.md"

  build:
    name: Build specrelay ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - tool: specrelay
            goos: linux
            goarch: amd64
            archive_ext: tar.gz
          - tool: specrelay
            goos: linux
            goarch: arm64
            archive_ext: tar.gz
          - tool: specrelay
            goos: darwin
            goarch: amd64
            archive_ext: tar.gz
          - tool: specrelay
            goos: darwin
            goarch: arm64
            archive_ext: tar.gz
          - tool: specrelay
            goos: windows
            goarch: amd64
            archive_ext: zip
          - tool: specrelay
            goos: windows
            goarch: arm64
            archive_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p build
          output="build/specrelay"
          if [ "${GOOS}" = "windows" ]; then
            output="build/specrelay.exe"
          fi
          version="v0.0.0-dev"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          fi
          go build -trimpath -ldflags="-s -w -X github.com/DeeliN221/specrelay/internal/ozcli.version=${version} -X github.com/DeeliN221/specrelay/internal/app.Version=${version}" -o "${output}" ./cmd/specrelay

      - name: Verify release version entry points
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          expected="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then expected="v0.0.0-dev"; fi
          test "$(build/specrelay --version)" = "$expected"
          test "$(build/specrelay flow --version)" = "$expected"

      - name: Package Unix binary
        if: matrix.goos != 'windows'
        run: |
          set -euo pipefail
          archive="specrelay_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          cp build/specrelay build/oz
          tar -C build -czf "${archive}" specrelay oz

      - name: Package Windows binary
        if: matrix.goos == 'windows'
        run: |
          set -euo pipefail
          archive="specrelay_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          cp build/specrelay.exe build/oz.exe
          (cd build && zip "../${archive}" specrelay.exe oz.exe)

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: specrelay-${{ matrix.goos }}-${{ matrix.goarch }}
          path: specrelay_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > sha256sums.txt

      - name: Generate release notes
        run: bash scripts/extract-release-notes.sh CHANGELOG.md "${GITHUB_REF_NAME}" release-notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* CHANGELOG.md --clobber
